# Render deployment for the AnkleGaming website.
#
# The site is served by a small Node/Express server (server/) so that the
# contact popup can deliver real email notifications. The server serves the
# existing static files from "ankle gaming website" unchanged and handles
# POST /api/enquiry.
#
# After the first deploy, add the mail credentials in
# Render → your service → Environment (see server/.env.example).
# Never commit real credentials to this repository.
services:
  - type: web
    name: ankle-gaming-website
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: ENQUIRY_TO_EMAIL
        value: info@anklegaming.com
      - key: MAIL_FROM_NAME
        value: AnkleGaming Website
      - key: ENQUIRY_TIMEZONE
        value: Asia/Kolkata
      - key: TRUST_PROXY
        value: "1"
      # Secrets — set these in the Render dashboard, never in Git:
      #   MAIL_PROVIDER, SMTP_HOST, SMTP_PORT, SMTP_SECURE,
      #   SMTP_USER, SMTP_PASS, MAIL_FROM
      #   (or RESEND_API_KEY + RESEND_FROM instead)
